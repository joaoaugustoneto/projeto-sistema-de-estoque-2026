name: CI/CD Pipeline - StockManager

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
# =============================================================
  # JOB 1: Testes e Validação do Código (Garante a Qualidade)
  # =============================================================
  test-and-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      # 🟢 NOVO PASSO: Sobe o banco de dados usando o compose que já criamos!
      - name: Subir o Banco de Dados para Testes
        run: |
          docker compose up -d db
          echo "Aguardando 10 segundos para o banco criar as tabelas (init.sql)..."
          sleep 10

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            backend/package.json
            frontend/package.json

      # 🟢 NOVO PASSO: Passar as credenciais para o teste conectar no localhost
      - name: Instalar dependências e Testar o Backend
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: admin
          DB_PASSWORD: adminpassword
          DB_NAME: stock_db
        run: |
          cd backend
          npm install
          npm test

      - name: Instalar dependências e Build do Frontend
        run: |
          cd frontend
          npm install
          npm run build
  # =============================================================
  # JOB 2: Construção e Publicação das Imagens Docker
  # =============================================================
  build-docker-images:
    runs-on: ubuntu-latest
    needs: test-and-validate 

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # REQUISITO ATENDIDO: Uso de Secrets para variáveis sensíveis
      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build e Push da Imagem Docker - Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/stock-backend:latest

      - name: Build e Push da Imagem Docker - Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/stock-frontend:latest