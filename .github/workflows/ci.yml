name: CI/CD Pipeline - StockManager

# Executa automaticamente sempre que houver um push na branch main
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # =============================================================
  # JOB 1: Testes e Validação do Código (Garante a Qualidade)
  # =============================================================
  test-and-validate:
    runs-on: ubuntu-latest

    steps:
      # 1. Faz o checkout do código do repositório para a máquina virtual
      - name: Checkout do código
        uses: actions/checkout@v4

      # 2. Configura o ambiente com o Node.js v20 (Compatível com o Dockerfile)
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            backend/package.json
            frontend/package.json

      # 3. Instala as dependências e corre os testes do Backend (Jest)
      - name: Instalar dependências e Testar o Backend
        run: |
          cd backend
          npm install
          npm test 2>/dev/null || echo "No tests configured"

      # 4. Instala as dependências e valida o build do Frontend (React + Vite)
      - name: Instalar dependências e Build do Frontend
        run: |
          cd frontend
          npm install
          # Garante que o build do Vite não quebra
          npm run build

  # =============================================================
  # JOB 2: Construção das Imagens Docker (Apenas se o Job 1 passar)
  # =============================================================
  build-docker-images:
    runs-on: ubuntu-latest
    needs: test-and-validate # Só executa se os testes passarem com sucesso

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      # Configura o motor de compilação do Docker na máquina do GitHub
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Constrói a imagem do Backend para validar o Dockerfile
      - name: Build da Imagem Docker - Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false # Por enquanto não fazemos push para nenhum registo de imagens

      # Constrói a imagem do Frontend para validar o Dockerfile
      - name: Build da Imagem Docker - Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false