version: '3.8'

services:
  # ==========================================
  # BANCO DE DADOS (PostgreSQL)
  # ==========================================
  db:
    image: postgres:15-alpine
    container_name: stock_db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: stock_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - stock-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d stock_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # BACKEND (Node.js + Express)
  # ==========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stock_backend
    restart: always
    environment:
      - PORT=3000
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=admin
      - DB_PASSWORD=adminpassword
      - DB_NAME=stock_db
    ports:
      - "3000:3000"
    networks:
      - stock-network
    depends_on:
      db:
        condition: service_healthy

  # ==========================================
  # FRONTEND (React + Vite + Nginx)
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: stock_frontend
    restart: always
    environment:
      - VITE_API_URL=http://localhost:3000
    ports:
      # A porta externa pode ser 8080 (para você acessar no navegador), 
      # mas a porta interna do container DEVE ser 80 por causa do Nginx.
      - "8080:80" 
    networks:
      - stock-network
    depends_on:
      - backend

# ==========================================
# CONFIGURAÇÕES GLOBAIS DE REDE E VOLUMES
# ==========================================
networks:
  stock-network:
    driver: bridge

volumes:
  pgdata: